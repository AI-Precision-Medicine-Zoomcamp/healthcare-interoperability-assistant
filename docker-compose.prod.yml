services:
  backend:
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    expose:
      - "8000"
    environment:
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8501}
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    environment:
      API_BASE_URL: http://backend:8000/api
    read_only: true
    tmpfs:
      - /tmp
