services:
  - type: web
    name: healthcare-interoperability-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDARNT_API_KEY
        sync: false
      - key: VECTOR_DB_PROVIDER
        value: qdrant
      - key: QDRANT_COLLECTION_NAME
        value: healthcare_interop_assistant
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: PDF_UPLOAD_MAX_MB
        value: "5"
      - key: CORS_ALLOW_ORIGINS
        sync: false

  - type: web
    name: healthcare-interoperability-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: healthcare-interoperability-backend
          property: host
      - key: BACKEND_PORT
        fromService:
          type: web
          name: healthcare-interoperability-backend
          property: port
      - key: PDF_UPLOAD_MAX_MB
        value: "5"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
